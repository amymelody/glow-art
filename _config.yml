# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: Glow Wolf
subtitle: multimedia artist
email: amydigiov@gmail.com
description: > # this means to ignore newlines until "baseurl:"
  A chaos wolf making queer furry art.
#baseurl: "/jekyll-image-gallery-example" # the subpath of your site, e.g. /blog
url: "//amymelody.github.io" # the base hostname & protocol for your site
#twitter_username: jekyllrb
#github_username:  jekyll
bandcamp_username: glowwolf
bsky_username: glowpuppy.bsky.social

# Build settings
markdown: kramdown

defaults:
  -
    scope:
      path: "galleries"
    values:
      permalink: /:path/:basename:output_ext

exclude: [LICENSE-CODE.md, LICENSE-IMAGES, README.md, bower.json]
